<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Тёмные земли — генератор карты</title>

<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- ===================== ЦЕНТРАЛЬНОЕ ИГРОВОЕ ПОЛЕ ===================== -->
<main class="board">
    <div class="viewport">
        <canvas id="map" tabindex="0" aria-label="Карта мира"></canvas>
        <div class="legend">
            <span><b>Мышь</b> — тянуть</span>
            <span><b>Колесо</b> — зум</span>
            <span><b>WASD</b> — движение</span>
            <span><b>Клик</b> — выбор</span>
            <span><b>Esc</b> — сброс</span>
        </div>
    </div>
</main>

<!-- ===================== ВЕРХНЯЯ ПАНЕЛЬ (ГОЛОВА) ===================== -->
<header class="topbar frame">
    <button id="btn-my-faction">Моя фракция</button>
    <!-- Ресурсы фракции игрока: золото, еда, производство, население (наполняет main.js, см. SECTION: PLAYER) -->
    <div class="resources-bar" id="resources-bar" hidden></div>

    <!-- Кнопки вызова окон -->
    <div class="nav-buttons">
        <button id="btn-diplomacy">Дипломатия</button>
        <button id="btn-economy">Экономика</button>
        <button id="btn-map-settings" aria-pressed="true">Карта</button>
        <button id="btn-region" hidden>Регион</button>
    </div>
</header>

<!-- ===================== ЛЕВАЯ НИЖНЯЯ ПАНЕЛЬ: ДИНАМИЧЕСКИЕ ОКНА ===================== -->
<aside class="bottom-left-hud frame">
    <div class="window-content scroll">
        
        <!-- 1. Настройки Карты -->
        <section id="win-map-settings">
            <h2 class="panel-title">Настройки Карты</h2>
            <div class="group">
                <span class="label">Семя мира</span>
                <input id="seed" type="number" value="1" aria-label="Семя мира">
                <button id="generate" class="primary grow">Новая карта</button>
            </div>
            <div class="hr"></div>
            <div class="group">
                <span class="label">Слой</span>
                <button data-view="terrain" aria-pressed="true">Рельеф</button>
                <button data-view="temperature" aria-pressed="false">Температура</button>
                <button data-view="regions" aria-pressed="false">Регионы</button>
            </div>
            <div class="hr"></div>
            <div class="group">
                <span class="label">Наложения</span>
                <label><input type="checkbox" id="borders" checked>границы</label>
                <label><input type="checkbox" id="grid" checked>сетка</label>
                <label><input type="checkbox" id="factions-toggle" checked>фракции</label>
            </div>
            <div class="hr"></div>
            <div class="group">
                <span class="label">Стиль</span>
                <button id="mood" aria-pressed="true">Тёмный</button>
                <button id="settlements" aria-pressed="true">Поселения</button>
                <button id="demo-objects" aria-pressed="false">Объекты</button>
            </div>
            <div class="row" style="margin-top: 6px;">
                <button id="fit" class="grow">Вся карта</button>
            </div>
        </section>

        <!-- 2. Дипломатия и Фракции -->
        <section id="factions-panel" hidden>
            <h2 class="panel-title">Дипломатия и Фракции</h2>
            <div id="factions" aria-label="Фракции"></div>
        </section>

        <!-- 3. Моя Фракция (Заглушка) -->
        <section id="win-my-faction" hidden>
            <h2 class="panel-title">Моя Фракция</h2>
            <div id="my-faction" class="my-faction"></div>
        </section>

        <!-- 4. Экономика (Заглушка) -->
        <section id="win-economy" hidden>
            <h2 class="panel-title">Экономика</h2>
            <div id="economy" class="economy"></div>
        </section>

        <!-- 5. Детали Выбранного Региона -->
        <section id="win-region" hidden>
            <div id="selection" class="selection" hidden></div>
            <div id="owner-controls" class="group" hidden style="margin-top: 6px;"></div>
        </section>

    </div>
</aside>

<!-- ===================== ПРАВАЯ НИЖНЯЯ ПАНЕЛЬ: УПРАВЛЕНИЕ ХОДОМ ===================== -->
<aside class="bottom-right-hud frame">
    <span id="turn-status" hidden aria-live="polite">Ход 0</span>
    
    <div class="clock-display" role="group" aria-label="Время игры">
        <div class="chip"><span class="k">Ход</span><span class="v" id="chip-turn">0</span></div>
        <div class="chip"><span class="k">Сезон</span><span class="v" id="chip-season">Лето</span></div>
        <div class="chip"><span class="k">Год</span><span class="v" id="chip-year">1</span></div>
    </div>

    <div class="group" role="group" aria-label="Перейти к сезону" style="margin-bottom: 8px;">
        <button data-season="spring" aria-pressed="false">Весна</button>
        <button data-season="summer" aria-pressed="true">Лето</button>
        <button data-season="autumn" aria-pressed="false">Осень</button>
        <button data-season="winter" aria-pressed="false">Зима</button>
    </div>

    <div class="row" style="margin-bottom: 8px;">
        <button id="next-turn" class="primary grow" style="font-size: 12px; padding: 8px;">Следующий ход ▸</button>
        <button id="auto-turns" aria-pressed="false">Авто</button>
    </div>

    <div class="row" style="font-size: 12px;">
        <label>Автоход: <input id="auto-interval" type="number" value="2" min="0.2" step="0.2"> с</label>
    </div>
    <div class="row" style="font-size: 12px; margin-top: 4px;">
        <label><input type="checkbox" id="repaint-each-turn" checked>Перерисовывать карту</label>
    </div>
</aside>

<!-- ===================== СКРИПТЫ ИГРЫ ===================== -->
<script src="map-generator.js"></script>
<script src="seasons.js"></script>
<script src="map-painter.js"></script>
<script src="sprite-renderer.js"></script>
<script src="sprite-examples.js"></script>
<script src="map-renderer.js"></script>
<script src="faction-manager.js"></script>
<script src="turn-manager.js"></script>
<script src="economy-manager.js"></script>
<script src="faction-economy.js"></script>
<script src="ui-renderer.js"></script>
<script src="main.js"></script>

<!-- ===================== МЕНЕДЖЕР ДИНАМИЧЕСКИХ ОКОН ===================== -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const windows = {
        'btn-map-settings': document.getElementById('win-map-settings'),
        'btn-diplomacy': document.getElementById('factions-panel'),
        'btn-my-faction': document.getElementById('win-my-faction'),
        'btn-economy': document.getElementById('win-economy'),
        'btn-region': document.getElementById('win-region')
    };

    const buttons = document.querySelectorAll('.nav-buttons button, #btn-my-faction');   // «Моя фракция» стоит вне .nav-buttons

    function openWindow(activeBtnId) {
        Object.keys(windows).forEach(btnId => {
            const win = windows[btnId];
            const btn = document.getElementById(btnId);
            if (win) {
                if (btnId === activeBtnId) {
                    win.removeAttribute('hidden');
                    if (btn) btn.setAttribute('aria-pressed', 'true');
                } else {
                    win.setAttribute('hidden', '');
                    if (btn) btn.setAttribute('aria-pressed', 'false');
                }
            }
        });
    }

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            openWindow(btn.id);
        });
    });

    // Автоматическое переключение на окно региона при выборе клетки на карте
    const selectionDiv = document.getElementById('selection');
    if (selectionDiv) {
        const observer = new MutationObserver(() => {
            if (!selectionDiv.hasAttribute('hidden') && selectionDiv.innerText.trim() !== '') {
                const btnRegion = document.getElementById('btn-region');
                btnRegion.removeAttribute('hidden');
                openWindow('btn-region');
            }
        });
        observer.observe(selectionDiv, { attributes: true, childList: true, subtree: true });
    }
});
</script>
</body>
</html>
